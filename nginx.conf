user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Cache configuration
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=blog_cache:10m max_size=1g inactive=60m use_temp_path=off;

    upstream app {
        server node:3000;
    }

    server {
        listen 80;
        server_name _;

        # Disable caching for admin routes
        location /admin {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # No caching for admin area
            proxy_cache_bypass $http_pragma $http_authorization;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # API routes (server actions, etc.)
        location ~ ^/api {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache-Control for API
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Public blog content with SWR caching
        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable proxy caching
            proxy_cache blog_cache;
            proxy_cache_key $scheme$proxy_host$request_uri;
            proxy_cache_valid 200 60m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            
            # SWR headers: max-age=60, stale-while-revalidate=60 (1 min cache, 1 min stale)
            add_header Cache-Control "public, max-age=60, stale-while-revalidate=60" always;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Static assets with long cache
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2)$ {
            proxy_pass http://app;
            proxy_set_header Host $host;
            
            # Cache static assets for 30 days
            add_header Cache-Control "public, max-age=2592000, immutable";
            proxy_cache blog_cache;
            proxy_cache_valid 200 30d;
        }
    }
}
