name: Build release artifact

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts requires DATABASE_URL to be set (it's read via
      # prisma/config's env() helper, which throws if unset) for every
      # Prisma CLI invocation, including `prisma generate`. Nothing here
      # actually connects to a database, so a dummy value is enough.
      DATABASE_URL: postgresql://user:password@localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run generate
      - run: npm run build
      - run: npm ci --omit=dev --ignore-scripts
      - run: bash scripts/package-release.sh "${GITHUB_SHA}" dist-release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          files: |
            ${{ github.workspace }}/${{ github.sha }}.tar.gz
