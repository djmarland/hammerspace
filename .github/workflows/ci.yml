name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Same dummy value as release.yml: Prisma's config requires it to be
      # set, but nothing here opens a real database. Pages that read the DB
      # must be dynamic (not prerendered) or this build fails.
      DATABASE_PATH: /tmp/dummy.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
