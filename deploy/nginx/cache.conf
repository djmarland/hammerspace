# Proxy cache zone definitions.
#
# This snippet must be included inside the nginx `http {}` block (not inside
# a `server {}` block), for example by copying it to
# /etc/nginx/conf.d/hammerspace-cache.conf on the VPS.
#
# One cache path per environment keeps beta and production caches separate.
proxy_cache_path /var/cache/nginx/hammerspace-beta levels=1:2 keys_zone=beta_cache:10m max_size=1g inactive=60m use_temp_path=off;
proxy_cache_path /var/cache/nginx/hammerspace-prod levels=1:2 keys_zone=prod_cache:10m max_size=1g inactive=60m use_temp_path=off;
