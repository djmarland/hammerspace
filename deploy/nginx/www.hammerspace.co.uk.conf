# nginx site config for www.hammerspace.co.uk
#
# Install on the VPS at /etc/nginx/sites-available/www.hammerspace.co.uk
# and symlink into /etc/nginx/sites-enabled/, then reload nginx.
#
# Requires deploy/nginx/cache.conf to be included in the http {} block
# (e.g. copied to /etc/nginx/conf.d/hammerspace-cache.conf).
#
# TLS: run `certbot --nginx -d www.hammerspace.co.uk -d hammerspace.co.uk`
# after the HTTP server block below is working; certbot will add the
# listen 443 block and the HTTP->HTTPS redirect automatically.

upstream prod_hammerspace_app {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.hammerspace.co.uk hammerspace.co.uk;

    # Disable caching for admin routes
    location /admin {
        proxy_pass http://prod_hammerspace_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_pragma $http_authorization;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API routes (server actions, etc.)
    location ~ ^/api {
        proxy_pass http://prod_hammerspace_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Public blog content with SWR caching
    location / {
        proxy_pass http://prod_hammerspace_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache prod_cache;
        proxy_cache_key $scheme$proxy_host$request_uri;
        proxy_cache_valid 200 60m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        add_header Cache-Control "public, max-age=60, stale-while-revalidate=60" always;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Static assets with long cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2)$ {
        proxy_pass http://prod_hammerspace_app;
        proxy_set_header Host $host;

        add_header Cache-Control "public, max-age=2592000, immutable";
        proxy_cache prod_cache;
        proxy_cache_valid 200 30d;
    }
}
