services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hammerspace-app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Lives in ./build/ via the .:/app bind mount (gitignored).
      DATABASE_PATH: /app/build/hammerspace.db
      AUTH_SECRET: ${AUTH_SECRET:-your-secret-key-change-in-production}
      CI: "true"
      PORT: ${APP_PORT:-3000}
      UPLOAD_DIR: /var/www/assets.hammerspace.co.uk/uploaded
      PUBLIC_ASSETS_URL: ${PUBLIC_ASSETS_URL:-http://localhost/uploaded}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      # Keep the image's Linux node_modules instead of the host's, which
      # have macOS builds of native modules (e.g. better-sqlite3).
      - /app/node_modules
      - assets_data:/var/www/assets.hammerspace.co.uk
    networks:
      - hammerspace-network
    #    command: sh -c "npx prisma db push --accept-data-loss && npm run dev"
    command: sh -c "npx prisma generate && npm run dev"

  nginx:
    image: nginx:alpine
    container_name: hammerspace-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - assets_data:/var/www/assets.hammerspace.co.uk
    depends_on:
      - node
    networks:
      - hammerspace-network

volumes:
  assets_data:

networks:
  hammerspace-network:
    driver: bridge
